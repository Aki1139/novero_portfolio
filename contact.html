<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="js/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="css/styles.css">

  <title>Contact | Aki Novero</title>
</head>
<body>
  <header class="site-header">
    <div class="logo">Aki Novero</div>

    <nav class="navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="skills.html">Skills</a>
      <a class="active" href="contact.html">Contact</a>

      <label class="theme-button">
        <input id="theme-toggle" type="checkbox" hidden>
        🌙
      </label>
    </nav>
  </header>

  <main>
    <section class="contact-card">
      <h1>Get in Touch</h1>

      <form id="contact-form" class="contact-form">
        <div>
          <label for="contact-name">Your Name:</label>
          <input id="contact-name" type="text" required>
        </div>

        <div>
          <label for="contact-email">Your Email Address:</label>
          <input id="contact-email" type="email" required>
        </div>

        <div>
          <label for="contact-message">Your Message:</label>
          <textarea id="contact-message" required></textarea>
        </div>

        <button class="submit-button" type="submit">
          Send Message
        </button>
      </form>

      <p id="contact-status"></p>
    </section>
  </main>

  <footer class="site-footer">
    © 2026 Aki Novero. All rights reserved.
  </footer>

  <script src="js/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
